name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release (tag or commit)
        required: true
        default: main
        type: string
      tag:
        description: 'Version tag to create on manual release (example: v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tag/ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate release build
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Package release artifact
        shell: bash
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          TAR_NAME="workwindow-dist-${RELEASE_COMMIT}.tar.gz"
          tar -czf "$TAR_NAME" dist
          sha256sum "$TAR_NAME" > "${TAR_NAME}.sha256"
          echo "TAR_NAME=$TAR_NAME" >> "$GITHUB_ENV"

      - name: Prepare tag name
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="$REQUESTED_TAG"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Use a semantic version tag such as v0.2.0 or v0.2.0-rc.1." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ${{ env.TAR_NAME }}
            ${{ env.TAR_NAME }}.sha256
